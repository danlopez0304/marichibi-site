<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Marichibi’s Fiesta Run</title>

  <!-- Preload the letterbox background image -->
  <link rel="preload" as="image" href="assets/mid-bg-mobile.jpg">

  <link rel="stylesheet" href="style.css?v=21" />
</head>
<body>
  <div id="game-root"></div>

  <!-- HUD -->
  <div class="hud" role="status" aria-live="polite">
    Score: <span id="score">0</span> — Best: <span id="best">0</span>
  </div>

  <!-- Buttons -->
  <div class="btnbar">
    <button class="btn" id="btn-pause" type="button">Pause</button>
    <button class="btn alt" id="btn-restart" type="button">Restart</button>
    <button class="btn" id="btn-full" type="button">Fullscreen</button>
    <button class="btn" id="btn-mute" type="button">Mute</button>
    <label for="vol" class="label-vol">Volume</label>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.4" title="Adjust game volume">
  </div>

  <div class="hint">Space = Jump • Hold ↓/S or tap bottom to Duck • Collect donuts!</div>

  <!-- Phaser CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>

  <!-- IMPORTANT: config FIRST, then game -->
  <script src="config.js?v=21"></script>
  <script src="game.js?v=21"></script>

  <!-- Optional helpers: fullscreen + iOS audio unlock -->
  <script>
    // Fullscreen toggle (works after Phaser creates the game)
    document.getElementById('btn-full').addEventListener('click', () => {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen)?.call(el);
      }
    });

    // iOS audio unlock: first user gesture triggers a silent AudioContext resume
    (function () {
      let unlocked = false;
      const unlock = () => {
        if (unlocked) return;
        try {
          const ctx = window.__audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          window.__audioCtx = ctx;
          if (ctx.state === 'suspended') ctx.resume();
          unlocked = true;
          window.removeEventListener('touchend', unlock, true);
          window.removeEventListener('click', unlock, true);
        } catch {}
      };
      window.addEventListener('touchend', unlock, true);
      window.addEventListener('click', unlock, true);
    })();
  </script>
</body>
</html>
